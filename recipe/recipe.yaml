schema_version: 1

context:
  version: "3.3.2"

package:
  name: erddapy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/erddapy/erddapy-${{ version }}.tar.gz
  sha256: 1e8fcc240bbdf9488b0e17e39d723016e1f4ba88e174bf81fcf9df13e51b5797

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - pandas <4,>=0.25.2
    - requests
    - xarray

tests:
  - python:
      imports:
        - erddapy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python interface for ERDDAP
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/ioos/erddapy
  documentation: https://ioos.github.io/erddapy/

extra:
  recipe-maintainers:
    - ocefpaf
